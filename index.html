<style>
:root{
  --g950:#0b0f17; --g900:#111827; --g850:#18202e; --g800:#1f2937; --g750:#2b3544; --g700:#374151; --g600:#4b5563; --g500:#6b7280; --g400:#9ca3af; --g300:#d1d5db; --g200:#e5e7eb;
  --amber:#fcd34d; --brand:#363c98; --brand2:#4f57c9; --brand3:#9aa1ff; --emerald:#059669; --red:#ef4444;
  --cv:#4f7cff; --ci:#a78bfa; --ct:#f59e0b; --ca:#10b981; --cc:#ec4899;
  --tlh:300px; --binw:250px; --inspw:290px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g900);color:var(--g200);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}
svg{flex:none}

/* ---------- En-tête ---------- */
header{background:var(--g800);border-bottom:1px solid var(--g700);display:flex;align-items:center;gap:8px;padding:8px;z-index:60;position:relative;min-height:54px}
.wordmark{margin:0 8px 0 4px;flex:none;line-height:0}
.wordmark svg{height:24px;width:auto;display:block}
@media (max-width:1250px){.wordmark svg{height:19px}}
.hgroup{display:flex;align-items:center;gap:4px;padding:3px;background:var(--g850);border:1px solid var(--g700);border-radius:7px;flex:none}
.hbtn{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g700);border:1px solid var(--g600);border-radius:5px;cursor:pointer;color:var(--g200);white-space:nowrap;flex:none}
.hbtn:hover{background:var(--g600)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px}
.hbtn .chev{width:11px;height:11px;opacity:.7;margin-left:-2px;color:var(--g400)}
.hbtn.ico{padding:0}
[data-act="undo"] svg,[data-act="redo"] svg{color:#fcd34d}
[data-act="new"] svg{color:#4ade80}
[data-act="import"] svg{color:#60a5fa}
[data-menu="m-clip"] svg:first-child{color:#f87171}
[data-menu="m-titles"] svg:first-child{color:#fbbf24}
[data-menu="m-fx"] svg:first-child{color:#f472b6}
[data-menu="m-proj"] svg:first-child{color:#a78bfa}
[data-act="fullscreen"] svg{color:#93c5fd}
[data-menu="m-file"] svg{color:#60a5fa}
[data-menu="m-export"] svg{color:#fb923c}
[data-act="guide"] svg{color:#facc15}
[data-act="settings"] svg{color:#c4b5fd}
.hbtn:disabled svg{color:var(--g500)!important}
@media (max-width:1300px){.install .lbl{display:none}.hbtn.install{padding:0 8px}}
@media (max-width:1120px){.hgroup .hbtn .lbl{display:none}.doc-name{display:none}}
.hbtn.install{background:var(--emerald);border-color:#10b981;color:#fff;font-weight:600}
.hbtn.install:hover{background:#10b981}
.spacer{flex:1}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;width:max-content;background:var(--g800);border:1px solid var(--g600);border-radius:8px;padding:5px;z-index:100}
.menu.right{left:auto;right:0;min-width:300px}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;padding:6px 10px;background:none;border:0;border-radius:5px;cursor:pointer;text-align:left;white-space:nowrap}
.menu button:hover{background:var(--g700)}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu .sub{position:relative}
.menu .sub>button::after{content:"";width:6px;height:6px;border-right:2px solid var(--g400);border-top:2px solid var(--g400);transform:rotate(45deg);margin-right:3px}
.menu .sub:hover>button{background:var(--g700)}
.smenu{display:none;position:absolute;left:100%;top:-6px;margin-left:3px;min-width:220px;width:max-content;background:var(--g800);border:1px solid var(--g600);border-radius:8px;padding:5px;z-index:110}
.smenu::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:8px}
.menu .sub:hover>.smenu{display:block}
.mi{display:flex;align-items:center;gap:10px}
.mi svg{width:17px;height:17px}
.menu button kbd{font:11px ui-monospace,monospace;color:var(--amber);opacity:.85}
.menu hr{border:0;border-top:1px solid var(--g700);margin:4px 2px}
.menu .mlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--g500);padding:6px 10px 2px}
.menu select{background:var(--g900);border:1px solid var(--g600);border-radius:4px;padding:3px}
.doc-name{font-weight:600;color:var(--g200);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.doc-name .dirty{color:var(--amber)}
.doc-name small{color:var(--g500);font-weight:500;margin-left:6px}

/* ---------- Corps ---------- */
main{flex:1;display:flex;min-height:0}
aside.tools{width:144px;background:var(--g800);border-right:1px solid var(--g700);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;z-index:10;flex:none;padding:2px 0 8px}
.tsec{border-bottom:1px solid var(--g700);padding:0 8px 9px}
.tsec:last-child{border-bottom:0}
.tsec-h{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 7px;font-size:11px;font-weight:800;letter-spacing:.03em;white-space:nowrap;color:var(--g400);cursor:pointer;text-transform:uppercase}
.tsec-h:hover{color:var(--g200)}
.tsec-h svg{width:13px;height:13px;transition:transform .15s}
.tsec.collapsed .tsec-h svg{transform:rotate(-90deg)}
.tsec.collapsed .tframe{display:none}
.tsec.collapsed{padding-bottom:0}
.tframe{border:1px solid var(--g700);border-radius:9px;background:#18202c;padding:6px}
.tgrid{display:grid;grid-template-columns:repeat(3,34px);gap:6px;justify-content:center}
.tool-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#222c3a;border:1px solid #3a4454;border-radius:6px;cursor:pointer;color:var(--g200);padding:0;position:relative}
.tool-btn:hover{background:#2c3747;border-color:#4b5563}
.tool-btn.active{background:var(--brand2);border-color:var(--brand3);color:#fff!important}
.tool-btn.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.tool-btn svg{width:19px;height:19px}
.tool-btn.rec{color:#f87171}
.tool-btn.rec.live{background:#7f1d1d;border-color:#ef4444;animation:recp 1s infinite}
@keyframes recp{50%{background:#b91c1c}}
.c-blue{color:#60a5fa}.c-sky{color:#38bdf8}.c-amber{color:#fbbf24}.c-red{color:#f87171}.c-green{color:#4ade80}.c-pink{color:#f472b6}.c-purple{color:#c4b5fd}.c-teal{color:#2dd4bf}.c-orange{color:#fb923c}.c-mm{color:#a5abff}.c-gray{color:var(--g300)}

#work{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#top{flex:1;display:flex;min-height:140px}
.pane{background:var(--g800);display:flex;flex-direction:column;min-height:0;flex:none}
#bin{width:var(--binw);border-right:1px solid var(--g700)}
#insp{width:var(--inspw);border-left:1px solid var(--g700)}
.ph{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;background:var(--g850);border-bottom:1px solid var(--g700);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--g400);flex:none}
.ph .sp{flex:1}
.ph .pbtn{height:24px;min-width:24px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:5px;border:1px solid var(--g600);background:var(--g700);cursor:pointer;color:var(--g200);font-size:11px;letter-spacing:0;text-transform:none;font-weight:600}
.ph .pbtn:hover{background:var(--g600)}
.ph .pbtn svg{width:14px;height:14px}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.pb::-webkit-scrollbar,.tl-scroll::-webkit-scrollbar{width:8px;height:8px}
.pb::-webkit-scrollbar-thumb{background:var(--g600);border-radius:4px}

/* Médiathèque */
.binfilt{display:flex;gap:3px;padding:7px 8px;border-bottom:1px solid var(--g700);flex:none}
.binfilt button{flex:1;border:1px solid var(--g700);background:var(--g900);border-radius:6px;padding:4px 0;cursor:pointer;color:var(--g400);font-size:11.5px;font-weight:600}
.binfilt button.on{background:var(--brand);border-color:var(--brand2);color:#fff}
.bingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:8px}
.mcard{border:1px solid var(--g700);border-radius:8px;background:var(--g850);overflow:hidden;cursor:grab;position:relative}
.mcard:hover{border-color:var(--g500)}
.mcard.sel{border-color:var(--brand3);outline:1px solid var(--brand3)}
.mcard .th{aspect-ratio:16/9;background:#0b0f17 center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative}
.mcard .th canvas{width:100%;height:100%;display:block}
.mcard .th svg.k{width:28px;height:28px;opacity:.8}
.mcard .dur{position:absolute;right:4px;bottom:4px;font:600 10px ui-monospace,monospace;background:#000b;color:#fff;border-radius:4px;padding:1px 4px}
.mcard .kind{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#111827}
.mcard .kind svg{width:12px;height:12px}
.mcard .used{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#4ade80}
.mcard .nm{padding:4px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g300)}
.mcard .add{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--brand2);border:0;color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer}
.mcard .add svg{width:16px;height:16px}
.mcard:hover .add{display:flex}
.mcard.loading .th::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff14,transparent);animation:shim 1.2s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.binempty{margin:12px;border:2px dashed var(--g600);border-radius:12px;padding:22px 14px;text-align:center;color:var(--g400);cursor:pointer;line-height:1.5}
.binempty:hover{border-color:var(--brand3);color:var(--g200)}
.binempty svg{width:40px;height:40px;color:var(--brand3);display:block;margin:0 auto 8px}
.binempty b{color:var(--g200)}

/* Aperçu */
#viewer{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--g950)}
#vwrap{flex:1;position:relative;overflow:hidden;min-height:0;background:#0b0f17}
#cv{position:absolute;display:block;background:#000;outline:1px solid #ffffff1c}
#ovl{position:absolute;overflow:visible;touch-action:none}
#ovl .bx{fill:none;stroke:#fcd34d;stroke-width:2;vector-effect:non-scaling-stroke}
#ovl .hd{fill:#fcd34d;stroke:#111827;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:nwse-resize}
#ovl .hr{fill:#111827;stroke:#fcd34d;stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
#ovl .gd{stroke:#f472b6;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:6 4}
#ovl .sf{fill:none;stroke:#ffffff59;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 4}
#vempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#vempty div{text-align:center;color:var(--g500);font-size:13px;line-height:1.6}
#vempty svg{width:120px;height:auto;opacity:.22;display:block;margin:0 auto 12px}
#transport{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--g800);border-top:1px solid var(--g700)}
.tbtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--g600);background:var(--g700);border-radius:6px;cursor:pointer;color:var(--g200);padding:0}
.tbtn:hover{background:var(--g600)}
.tbtn svg{width:16px;height:16px}
.tbtn.big{width:40px;height:34px;background:var(--brand2);border-color:var(--brand3);color:#fff}
.tbtn.big:hover{background:#5f67dc}
.tbtn.on{border-color:var(--amber);color:var(--amber)}
.tc{font:600 15px ui-monospace,Menlo,monospace;color:#fff;letter-spacing:.02em;padding:0 6px;min-width:120px}
.tc small{color:var(--g500);font-size:12px;font-weight:500}
#vol{width:84px;accent-color:var(--brand3)}
.tsp{flex:1}

/* Séparateurs */
.vsplit{width:5px;cursor:col-resize;background:transparent;flex:none;margin:0 -2px;z-index:20;position:relative}
.vsplit:hover,.vsplit.on{background:var(--brand2)}
#hsplit{height:6px;cursor:row-resize;background:var(--g700);flex:none;position:relative}
#hsplit::after{content:"";position:absolute;left:50%;top:2px;width:40px;height:2px;margin-left:-20px;border-radius:2px;background:var(--g500)}
#hsplit:hover,#hsplit.on{background:var(--brand2)}

/* Timeline */
#tl{height:var(--tlh);flex:none;display:flex;flex-direction:column;background:var(--g850);min-height:120px}
#tlbar{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--g800);border-bottom:1px solid var(--g700)}
.tlb{height:26px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--g600);background:var(--g700);border-radius:5px;cursor:pointer;font-size:12px;color:var(--g200)}
.tlb:hover{background:var(--g600)}
.tlb svg{width:15px;height:15px}
.tlb.on{background:var(--brand);border-color:var(--brand3);color:#fff}
.tlb.ico{padding:0;width:28px;justify-content:center}
#zoom{width:120px;accent-color:var(--brand3)}
.tlsep{width:1px;height:20px;background:var(--g700)}
#tlbody{flex:1;display:flex;min-height:0;position:relative}
#tlheads{width:132px;flex:none;background:var(--g800);border-right:1px solid var(--g700);position:relative;overflow:hidden}
#tlheads .rulerpad{height:26px;border-bottom:1px solid var(--g700);display:flex;align-items:center;justify-content:center;font:600 11px ui-monospace,monospace;color:var(--g400);background:var(--g850)}
#theads{position:absolute;left:0;right:0;top:26px}
.thd{display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--g750);position:absolute;left:0;right:0}
.thd .tn{font-weight:800;font-size:12px;width:26px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#111827}
.thd.v .tn{background:var(--cv)}.thd.a .tn{background:var(--ca)}
.thd .tsp{flex:1}
.thd button{width:24px;height:24px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;color:var(--g400);display:flex;align-items:center;justify-content:center;padding:0}
.thd button:hover{background:var(--g700);color:var(--g200)}
.thd button svg{width:15px;height:15px}
.thd button.off{color:#f87171}
.thd button.lk{color:var(--amber)}
.thd .del{opacity:0}.thd:hover .del{opacity:1}
#tlwrap{flex:1;position:relative;min-width:0;overflow:hidden}
#tlc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hscroll{height:12px;flex:none;background:var(--g900);border-top:1px solid var(--g700);position:relative;margin-left:132px}
#hthumb{position:absolute;top:2px;height:7px;border-radius:4px;background:var(--g600);cursor:grab;min-width:24px}
#hthumb:hover{background:var(--g500)}

/* Inspecteur */
#insp .pb{padding:10px}
.icard{--tc:#60a5fa;display:flex;align-items:center;gap:9px;font-weight:800;color:#fff;margin:0 0 10px;padding:7px 8px;border-radius:9px;background:color-mix(in srgb,var(--tc) 16%,#1f2937);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.icard .ic{display:flex;width:30px;height:30px;flex:none;border-radius:8px;align-items:center;justify-content:center;background:var(--tc);color:#111827}
.icard .ic svg{width:18px;height:18px}
.icard input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 5px;font-weight:700;color:#fff}
.icard input:hover,.icard input:focus{border-color:var(--g600);background:#111827;outline:none}
.icard .k{font:700 10px ui-monospace,monospace;padding:2px 6px;border-radius:5px;background:#111827;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent)}
.isec{border:1px solid var(--g700);border-radius:10px;margin-bottom:9px;background:#1b2431;overflow:hidden}
.isec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g300)}
.isec-h:hover{color:#fff}
.isec-h svg{width:15px;height:15px}
.isec-h .chev{margin-left:auto;width:12px;height:12px;transition:transform .15s;color:var(--g500)}
.isec.closed .isec-h .chev{transform:rotate(-90deg)}
.isec.closed .isec-b{display:none}
.isec-b{padding:2px 10px 10px}
.f{margin:7px 0}
.f>label{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--g400);margin-bottom:3px}
.f>label b{color:#fff;font:600 11.5px ui-monospace,monospace;background:#111827;border:1px solid var(--g700);border-radius:5px;padding:0 6px}
.f input[type=range]{width:100%;accent-color:var(--brand3);margin:0}
.f input[type=number],.f input[type=text],.f select,.f textarea{width:100%;background:#111827;border:1px solid var(--g700);border-radius:7px;color:var(--g200);padding:5px 8px}
.f textarea{resize:vertical;min-height:62px;font-family:inherit;user-select:text}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fc{display:flex;align-items:center;gap:8px}
.fc input[type=color]{width:40px;height:28px;border:1px solid var(--g600);border-radius:7px;background:none;padding:1px;cursor:pointer;flex:none}
.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--g700);border-radius:9px;background:#111827}
.seg button{flex:1;border:0;border-radius:6px;background:none;color:var(--g400);padding:5px 0;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button svg{width:15px;height:15px}
.seg button:hover{background:#1f2937;color:var(--g200)}
.seg button.on{background:var(--brand2);color:#fff}
.ibtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ibtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:8px;border:1px solid var(--g600);background:#273244;color:var(--g200);cursor:pointer;font-size:12px;font-weight:600}
.ibtn:hover{border-color:var(--brand3);color:#fff;background:#2e3b52}
.ibtn svg{width:14px;height:14px}
.ibtn.wide{grid-column:1/-1}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{border:1px solid var(--g700);background:#111827;border-radius:8px;padding:4px 2px 5px;cursor:pointer;color:var(--g300);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.chip:hover{border-color:var(--g500);color:#fff}
.chip.on{border-color:var(--brand3);background:color-mix(in srgb,var(--brand2) 35%,#111827);color:#fff}
.chip i{width:100%;height:26px;border-radius:5px;display:block;background-size:cover;background-position:center}
.chip svg{width:30px;height:22px}
.tchips{grid-template-columns:repeat(5,1fr)}
.isub{font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.ihint{color:var(--g500);font-size:12px;text-align:center;padding:4px}
.kv{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px dashed var(--g700);font-size:12px}
.kv span{color:var(--g400)}.kv b{color:#fff;font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;color:var(--g300);cursor:pointer}
.tog input{display:none}
.tog i{width:34px;height:19px;border-radius:10px;background:var(--g600);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.tog input:checked+i{background:var(--brand2)}
.tog input:checked+i::after{left:17px}

/* Modales */
.modal-bg{position:fixed;inset:0;background:#05070bcc;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--g800);border:1px solid var(--g600);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(980px,100%);height:min(720px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--g700);font-weight:800;font-size:15px;color:#fff}
.mh svg{width:20px;height:20px}
.mh .x{margin-left:auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--g600);background:var(--g700);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g300)}
.mh .x:hover{background:var(--g600);color:#fff}
.mb{padding:16px;overflow-y:auto;flex:1;min-height:0}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--g700)}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--g600);background:var(--g700);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--g200)}
.btn:hover{background:var(--g600)}
.btn.pri{background:var(--brand2);border-color:var(--brand3);color:#fff}
.btn.pri:hover{background:#5f67dc}
.btn.ok{background:var(--emerald);border-color:#10b981;color:#fff}
.btn.red{background:#7f1d1d;border-color:#b91c1c;color:#fff}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
.fmts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fmt{border:1px solid var(--g700);border-radius:10px;background:#111827;cursor:pointer;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--g300);font-size:11.5px;font-weight:600;text-align:center}
.fmt:hover{border-color:var(--g500);color:#fff}
.fmt.on{border-color:var(--brand3);background:color-mix(in srgb,var(--brand2) 30%,#111827);color:#fff}
.fmt .r{border:2px solid currentColor;border-radius:4px;opacity:.85}
.fmt small{color:var(--g500);font-weight:500;font-size:10.5px}
.startbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bigopt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--g600);background:#273244;cursor:pointer;text-align:left;color:var(--g200)}
.bigopt:hover{border-color:var(--brand3);color:#fff}
.bigopt svg{width:24px;height:24px;flex:none}
.bigopt b{display:block;font-size:13px}
.bigopt small{color:var(--g400);font-size:11.5px}
.prog{height:10px;border-radius:6px;background:#111827;border:1px solid var(--g700);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand2),var(--brand3));transition:width .2s}
.meter{height:12px;border-radius:6px;background:#111827;border:1px solid var(--g700);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#10b981,#fbbf24 70%,#ef4444)}

/* Guide */
.guide{display:flex;flex:1;min-height:0}
.gnav{width:64px;flex:none;border-right:1px solid var(--g700);background:var(--g850);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;overflow-y:auto}
.gnav button{width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--g400);display:flex;align-items:center;justify-content:center}
.gnav button svg{width:22px;height:22px}
.gnav button:hover{background:var(--g700);color:#fff}
.gnav button.on{background:var(--brand);border-color:var(--brand3);color:#fff}
.gbody{flex:1;overflow-y:auto;padding:22px 28px;line-height:1.65;color:var(--g300);font-size:14px;user-select:text}
.gbody h2{margin:0 0 4px;color:#fff;font-size:21px;display:flex;align-items:center;gap:10px}
.gbody h2 svg{width:26px;height:26px;color:var(--brand3)}
.gbody .lead{color:var(--g400);margin:0 0 18px}
.gbody h3{color:#fff;font-size:15px;margin:20px 0 6px}
.gbody p{margin:6px 0}
.gbody b{color:#fff}
.gbody ul{margin:6px 0;padding-left:20px}
.gbody li{margin:4px 0}
.gbody .gk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:#222c3a;border:1px solid #3a4454;vertical-align:middle;margin:0 2px}
.gbody .gk svg{width:16px;height:16px}
.gbody kbd{font:12px ui-monospace,monospace;background:#111827;border:1px solid var(--g600);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--amber)}
.gbody .tip{border:1px solid color-mix(in srgb,var(--brand3) 45%,transparent);background:color-mix(in srgb,var(--brand2) 14%,#1f2937);border-radius:10px;padding:10px 14px;margin:14px 0}
.gbody .tip b{color:var(--brand3)}
.gbody table{border-collapse:collapse;width:100%;font-size:13px}
.gbody td{padding:6px 8px;border-bottom:1px solid var(--g700)}
.gbody td:first-child{white-space:nowrap;width:1%}
.gfig{display:block;margin:12px 0;border-radius:10px;border:1px solid var(--g700);background:#0f1520;width:100%;height:auto}

/* Toasts & menu contextuel */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--g800);border:1px solid var(--g600);border-left:4px solid var(--brand3);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;animation:tin .2s ease-out}
.toast.err{border-left-color:#ef4444}.toast.ok{border-left-color:#10b981}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#ctx{position:fixed;z-index:800}
#ctx .menu{position:static}
#dropzone{position:fixed;inset:12px;border:3px dashed var(--brand3);border-radius:14px;background:#0b0f17cc;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;pointer-events:none;z-index:400;flex-direction:column;gap:10px}
#dropzone svg{width:56px;height:56px;color:var(--brand3)}
#pool{position:fixed;left:-10px;top:-10px;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}
#pool video{width:2px;height:2px}

#mv-splash .mv-m1{transform-origin:422px 421px;animation:mv-m1 1.45s both}
#mv-splash .mv-m2{transform-origin:422px 799px;animation:mv-m2 1.45s both}

#mv-splash .mv-o1{animation:mv-o 1s .08s both}
#mv-splash .mv-o2{animation:mv-o 1s .2s both}

@keyframes mv-m2{0%,8%{opacity:0;transform:translate(406.5px,-189px) scale(.3)}22%{opacity:1;transform:translate(406.5px,-189px) scale(.42)}50%{transform:translate(406.5px,-189px) scale(.42);animation-timing-function:cubic-bezier(.55,0,.3,1)}70%{transform:translate(0px,-189px) scale(.42);animation-timing-function:cubic-bezier(.5,0,.3,1)}90%{transform:translate(0px,-8px) scale(1.02);animation-timing-function:ease-out}100%{opacity:1;transform:none}}

<script>(function(){var s=document.getElementById('mv-splash');if(!s)return;
var on=true;try{var st=JSON.parse(localStorage.getItem('momomov.settings')||'{}');if(st.splash===false)on=false;}catch(e){}
if(!on||matchMedia('(prefers-reduced-motion: reduce)').matches){s.remove();return;}
var reel=document.getElementById('mv-reel'),h='';for(var k=0;k<10;k++){h+='<use href="#mv-letters" y="'+(-k*1240)+'"/><rect x="874" y="'+(-k*1240-22)+'" width="396" height="22" fill="#262934"/>';}
h+='<rect x="874" y="1218" width="396" height="22" fill="#262934"/>';reel.insertAdjacentHTML('beforeend',h);
function done(){if(s&&s.parentNode)s.parentNode.removeChild(s);s=null;window.dispatchEvent(new Event('mv-splash-done'));}
function skip(){if(s&&!s.classList.contains('mv-skip')){s.classList.add('mv-skip');setTimeout(done,300);}}
s.addEventListener('animationend',function(e){if(e.target===s&&e.animationName==='mv-out')done();});
setTimeout(done,5600);
['mousedown','keydown','touchstart','wheel'].forEach(function(ev){window.addEventListener(ev,skip,{once:true,capture:true,passive:true});});})();</script>

const VW = { k: 1 };
function fitViewer() {
  if (!P) return;

  if (cv.width !== P.w || cv.height !== P.h) { cv.width = P.w; cv.height = P.h; CX = cv.getContext('2d'); }
  const W = w.clientWidth - 24, H = w.clientHeight - 24; if (W < 10 || H < 10) return;
  const k = Math.min(W / P.w, H / P.h), cw = P.w * k, ch = P.h * k, l = (w.clientWidth - cw) / 2, t = (w.clientHeight - ch) / 2;
  for (const el of [cv, ov]) Object.assign(el.style, { left: l + 'px', top: t + 'px', width: cw + 'px', height: ch + 'px' });
  ov.setAttribute('viewBox', `0 0 ${P.w} ${P.h}`); VW.k = k;
  $('#vempty').classList.toggle('hidden', P.clips.length > 0);
  reqDraw();
}
function overlayClip() {
  const act = activeVisuals(T);
  for (let i = act.length - 1; i >= 0; i--) if (SEL.has(act[i].id)) return act[i];
  return null;
}
let OVLH = '', VDRAG = null;
function drawOverlay() {
  const o = $('#ovl'); if (!o || !P) return;
  let h = '';
  if (SET.safe) {
    const r = (f, d) => `<rect class="sf" x="${P.w * (1 - f) / 2}" y="${P.h * (1 - f) / 2}" width="${P.w * f}" height="${P.h * f}"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
    h += r(.9) + r(.8, '2 6') + `<path class="sf" d="M${P.w / 2 - 20} ${P.h / 2}h40M${P.w / 2} ${P.h / 2 - 20}v40"/>`;
  }
  const c = !PLAY.on || VDRAG ? overlayClip() : null;
  if (c) {
    const X = clipXform(c, T, trState(c, T)); const cs = Math.cos(X.r), sn = Math.sin(X.r);
    const P2 = (x, y) => [X.cx + (x * cs - y * sn) * X.s, X.cy + (x * sn + y * cs) * X.s];
    const hw = X.w / 2, hh = X.h / 2; const pts = [P2(-hw, -hh), P2(hw, -hh), P2(hw, hh), P2(-hw, hh)];
    const rad = 6 / VW.k, top = P2(0, -hh), rt = P2(0, -hh - 34 / VW.k / X.s);
    h += `<polygon class="bx" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    h += `<line class="bx" x1="${top[0]}" y1="${top[1]}" x2="${rt[0]}" y2="${rt[1]}"/><circle class="hr" data-h="rot" cx="${rt[0]}" cy="${rt[1]}" r="${rad * 1.1}"/>`;
    pts.forEach((p, i) => { h += `<rect class="hd" data-h="sc" x="${p[0] - rad}" y="${p[1] - rad}" width="${rad * 2}" height="${rad * 2}" rx="${rad * .35}"/>`; });
  }
  if (VDRAG && VDRAG.gx) h += `<line class="gd" x1="${P.w / 2}" y1="0" x2="${P.w / 2}" y2="${P.h}"/>`;
  if (VDRAG && VDRAG.gy) h += `<line class="gd" x1="0" y1="${P.h / 2}" x2="${P.w}" y2="${P.h / 2}"/>`;
  if (h !== OVLH) { o.innerHTML = h; OVLH = h; }
}
function renderOverlayOnly() { drawOverlay(); }
function vpt(e) { const r = $('#cv').getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * P.w, y: (e.clientY - r.top) / r.height * P.h }; }
function hitClip(p) {
  const list = activeVisuals(T);

    const c = list[i]; if (lockedClip(c)) continue;
    const X = clipXform(c, T, trState(c, T)); const dx = p.x - X.cx, dy = p.y - X.cy, cs = Math.cos(-X.r), sn = Math.sin(-X.r);
    const lx = (dx * cs - dy * sn) / X.s, ly = (dx * sn + dy * cs) / X.s;

}
function viewerInit() {
  const w = $('#vwrap');

    if (!P || e.button !== 0) return;
    const p = vpt(e); const hk = e.target.closest && e.target.closest('[data-h]');

    if (PLAY.on) pause();
    if (!SEL.has(c.id) || SEL.size > 1) { SEL = new Set([c.id]); refreshInsp(); TLdraw(); }

    if (!VDRAG) { if (!P) return; const hk = e.target.closest && e.target.closest('[data-h]'); w.style.cursor = hk ? '' : (hitClip(vpt(e)) ? 'move' : 'default'); return; }
    const d = VDRAG, c = d.c, p = vpt(e);

    }

  const end = () => { if (!VDRAG) return; VDRAG = null; commit(); refreshInsp(); drawOverlay(); reqDraw(); };
  w.addEventListener('pointerup', end); w.addEventListener('pointercancel', end);
  w.addEventListener('dblclick', e => { const c = P && hitClip(vpt(e)); if (c && c.type === 'text') { SEL = new Set([c.id]); refreshInsp(); const ta = $('#insp textarea'); if (ta) { ta.focus(); ta.select(); } } });

  }, { passive: false });
  $('#vempty').innerHTML = `<div>${logoSVG()}<b style="color:var(--g300)">Bienvenue dans MOMOmov</b><br>Importez des vidéos, des sons et des images,<br>puis glissez-les dans la timeline.</div>`;
}

const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;

    return this.db;
  },
  async run(store, mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(s, k, v) { return this.run(s, 'readwrite', o => o.put(v, k)); },
  get(s, k) { return this.run(s, 'readonly', o => o.get(k)); },
  del(s, k) { return this.run(s, 'readwrite', o => o.delete(k)); },
  keys(s) { return this.run(s, 'readonly', o => o.getAllKeys()); }
};

function wireFmt(root, cur) {
  const upd = () => { const f = FORMATS.find(x => x.k === cur.fmt); const d = dimsFor(f.ar, +$('#fres', root).value); $('#fdims', root).textContent = `${d.w} × ${d.h} px`; };
  $('#fmtp', root).addEventListener('click', e => { const b = e.target.closest('[data-fmt]'); if (!b) return; cur.fmt = b.dataset.fmt; $$('.fmt', root).forEach(x => x.classList.toggle('on', x === b)); upd(); });
  $('#fres', root).onchange = upd; upd();
  return () => ({ fmt: cur.fmt, res: +$('#fres', root).value, fps: +$('#ffps', root).value });
}

/* ---------- Démarrage / nouveau projet ---------- */
async function startDialog(fromMenu) {
  if (fromMenu && DIRTY && P && P.clips.length && !await confirmP('Le montage en cours a des modifications non enregistrées. En commencer un nouveau ?', 'Nouveau')) return;
  const bk = await lastBackup();
  const cur = { fmt: '16:9', res: 1080, fps: 30 };
  const m = modal(`<div class="mh">${ic('film', '', ' style="color:#9aa1ff"')}Nouveau montage${P ? `<button class="x" data-close>${ic('x')}</button>` : ''}</div>
    <div class="mb">
      <div class="f"><label>Nom du projet</label><input type="text" id="npname" value="Nouveau montage"></div>
      <div class="isub" style="margin-top:12px">Format de la vidéo</div>
      ${fmtPicker(cur)}
      <div class="startbtns">
        <button class="bigopt" id="npopen">${ic('folder', '', ' style="color:#60a5fa"')}<span><b>Ouvrir un projet</b><small>Fichier .mmv ou médias</small></span></button>
        ${bk ? `<button class="bigopt" id="nprest">${ic('restore', '', ' style="color:#fbbf24"')}<span><b>Reprendre la sauvegarde auto</b><small>${esc(bk.name)} · ${new Date(bk.date).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</small></span></button>` : `<button class="bigopt" data-close-guide>${ic('guide', '', ' style="color:#facc15"')}<span><b>Découvrir MOMOmov</b><small>Ouvrir le guide</small></span></button>`}
      </div>
    </div>
    <div class="mf"><button class="btn pri" id="npgo">${ic('check')}Créer le montage</button></div>`, { lock: !P });
  const get = wireFmt(m.el, cur);
  const create = () => {
    const o = get(); const nm = $('#npname', m.el).value.trim() || 'Nouveau montage';
    if (P) { if (PLAY.on) pause(); dropAllPlayers(); }
    P = newProjectData({ name: nm, fmt: o.fmt, res: o.res, fps: o.fps });
    HIST.u = []; HIST.r = []; PEND = null; SEL.clear(); T = 0; FILEH = null; saveProject.named = false; setDirty(false);
    m.close(); refreshAll(); setZoom(60, 0); TL.sx = 0;
    toast(`Montage ${P.w}×${P.h} à ${P.fps} i/s prêt`, 'ok');
  };
  $('#npgo', m.el).onclick = create;
  $('#npname', m.el).onkeydown = e => { if (e.key === 'Enter') create(); };
  $('#npopen', m.el).onclick = () => { if (!P) create(); openDialog(); };
  const r = $('#nprest', m.el); if (r) r.onclick = async () => { m.close(); if (!P) P = newProjectData(); await restoreBackup(); };
  const g = $('[data-close-guide]', m.el); if (g) g.onclick = () => { create(); openGuide(); };
}
function projDialog() {
  const cur = { fmt: P.fmt, res: P.res, fps: P.fps };
  const m = modal(`<div class="mh">${ic('sliders', '', ' style="color:#a78bfa"')}Format et réglages du projet<button class="x" data-close>${ic('x')}</button></div>
    <div class="mb">${fmtPicker(cur)}
      <div class="f fc" style="margin-top:12px"><input type="color" id="pbg" value="${P.bg}"><span>Couleur de fond du montage</span></div>
      ${tog('pscale', 'Adapter les positions et tailles de texte au nouveau format', true)}</div>
    <div class="mf"><button class="btn" data-close>Annuler</button><button class="btn pri" id="pok">${ic('check')}Appliquer</button></div>`);
  const get = wireFmt(m.el, cur);
  $('#pok', m.el).onclick = () => {
    const o = get(); const f = FORMATS.find(x => x.k === o.fmt); const d = dimsFor(f.ar, o.res);
    const kx = d.w / P.w, ky = d.h / P.h, kt = Math.min(kx, ky), sc = $('[data-k="pscale"]', m.el).checked;
    act(() => {
      if (sc) for (const c of P.clips) { c.x = Math.round(c.x * kx); c.y = Math.round(c.y * ky); if (c.txt) { c.txt.size = Math.max(4, Math.round(c.txt.size * kt)); c.txt.stroke = Math.round(c.txt.stroke * kt); } }
      Object.assign(P, { fmt: o.fmt, res: o.res, fps: o.fps, w: d.w, h: d.h, bg: $('#pbg', m.el).value });
      for (const c of P.clips) { c.start = fsnap(c.start); c.dur = Math.max(1 / P.fps, fsnap(c.dur)); }
    });
    m.close(); toast(`Format ${P.w}×${P.h} · ${P.fps} i/s`, 'ok');
  };
}

/* ---------- Export ---------- */
function exportDialog(audioOnly) {
  if (!P.clips.length) { toast('Le montage est vide : ajoutez des clips avant d\'exporter'); return; }
  const mp4 = !!pickMime('mp4'), webm = !!pickMime('webm');
  const st = { fmt: mp4 ? 'mp4' : 'webm', res: 'proj', q: 'high', range: P.io ? 'io' : 'all', mute: SET.exportMute };
  const resOpts = [['proj', `Projet (${P.w}×${P.h})`], ...[2160, 1440, 1080, 720, 480].filter(r => r < Math.min(P.w, P.h)).map(r => { const d = exportDims(r); return [r, `${r}p (${d.w}×${d.h})`]; })];
  const m = modal(`<div class="mh">${ic(audioOnly ? 'music' : 'exportv', '', ' style="color:#fb923c"')}${audioOnly ? 'Exporter le son' : 'Exporter la vidéo'}<button class="x" data-close>${ic('x')}</button></div>
    <div class="mb">
      <div class="f"><label>Nom du fichier</label><input type="text" id="exname" value="${esc(safeName(P.name))}"></div>
      ${audioOnly ? '' : `<div class="f"><label>Format</label><div class="seg" id="exfmt"><button data-v="mp4" class="${st.fmt === 'mp4' ? 'on' : ''}"${mp4 ? '' : ' disabled title="Non pris en charge par ce navigateur"'}>MP4 (partout)</button><button data-v="webm" class="${st.fmt === 'webm' ? 'on' : ''}"${webm ? '' : ' disabled'}>WebM (web)</button></div></div>
      <div class="f2"><div class="f"><label>Résolution</label><select id="exres">${resOpts.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select></div>
      <div class="f"><label>Qualité</label><select id="exq"><option value="std">Standard (léger)</option><option value="high" selected>Haute</option><option value="max">Maximale</option></select></div></div>`}
      <div class="f"><label>Partie à exporter</label><div class="seg" id="exrange"><button data-v="all" class="${st.range === 'all' ? 'on' : ''}">Tout le montage (${tc(projDur())})</button><button data-v="io" class="${st.range === 'io' ? 'on' : ''}"${P.io ? '' : ' disabled title="Définissez une zone avec I et O"'}>Zone${P.io ? ` (${tc(P.io.b - P.io.a)})` : ''}</button></div></div>
      ${tog('exmute', 'Couper le son des haut-parleurs pendant l\'export', st.mute)}
      <div class="kv" style="margin-top:6px"><span>Temps d'export estimé</span><b id="exest"></b></div>
      ${!mp4 && !audioOnly ? '<p style="color:var(--g500);font-size:12px">Ce navigateur n\'enregistre pas le MP4 : le WebM se lit dans tous les navigateurs et la plupart des lecteurs.</p>' : ''}
    </div>
    <div class="mf"><button class="btn" data-close>Annuler</button><button class="btn ok" id="exgo">${ic('exportv')}Exporter</button></div>`);
  const est = () => { const d = st.range === 'io' && P.io ? P.io.b - P.io.a : projDur(); $('#exest', m.el).textContent = '≈ ' + fmtDur(d + 2) + ' (lecture en temps réel)'; };
  m.el.addEventListener('click', e => { const b = e.target.closest('.seg button[data-v]'); if (!b || b.disabled) return; const seg = b.parentElement; $$('button', seg).forEach(x => x.classList.toggle('on', x === b)); if (seg.id === 'exfmt') st.fmt = b.dataset.v; if (seg.id === 'exrange') st.range = b.dataset.v; est(); });
  est();
  $('#exgo', m.el).onclick = () => {
    const nm = $('#exname', m.el).value.trim(); if (nm && nm !== safeName(P.name)) { P.name = nm; updDocName(); }
    SET.exportMute = $('[data-k="exmute"]', m.el).checked; saveSet();
    const o = { fmt: st.fmt, res: audioOnly ? 'proj' : ($('#exres', m.el).value === 'proj' ? 'proj' : +$('#exres', m.el).value), q: audioOnly ? 'high' : $('#exq', m.el).value, range: st.range, mute: SET.exportMute, audioOnly };
    m.close(); startExport(o);
  };
}

    <li><b>Animation</b> : <b>Machine</b> fait apparaître les lettres une à une, <b>Défilement</b> fait monter le texte du bas vers le haut sur toute la durée du clip, comme un générique de fin.</li></ul>
    <div class="tip"><b>Astuce :</b> pour qu'un générique défile plus lentement, allongez simplement le clip.</div>`],
  ['trans', 'trans', 'Transitions', `
    <p class="lead">Chaque clip a une transition d'<b>entrée</b> et une de <b>sortie</b>, réglables dans le bloc <b>Transitions</b>.</p>
    <ul><li><b>Fondu</b> : l'image apparaît ou disparaît en douceur.</li>
    <li><b>Noir / Blanc</b> : passage par un écran noir ou blanc, le grand classique entre deux scènes.</li>
    <li><b>Gauche, Droite, Bas, Haut</b> : l'image glisse dans le cadre.</li>
    <li><b>Zoom</b> : l'image grandit en apparaissant.</li>
    <li><b>Volet</b> : l'image est dévoilée de gauche à droite.</li></ul>
    <p>La durée se règle sous chaque choix. Dans la timeline, un petit triangle clair au coin du clip signale une transition.</p>
    <h3>Le fondu enchaîné</h3>
    <p>Pour que deux plans se mélangent, posez le second sur la piste du dessus en le faisant <b>chevaucher</b> la fin du premier, puis donnez-lui une entrée <b>Fondu</b> de la même durée que le chevauchement.</p>
    <p>Le menu <b>Effets</b> applique une transition d'entrée et de sortie à tous les clips sélectionnés d'un coup.</p>`],
  ['son', 'vol', 'Le son', `
    <p class="lead">Musique, ambiance, voix : tous les sons du montage se mélangent à l'export.</p>
    <h3>Régler un clip</h3>
    <ul><li>Le bloc <b>Son</b> règle le <b>volume</b> (jusqu'à 200 %), coupe le son ou ajoute des <b>fondus</b> d'entrée et de sortie. La ligne jaune dans la timeline montre l'enveloppe du volume.</li>
    <li>${gk('detach')} <b>Détacher le son</b> place le son d'une vidéo sur sa propre piste audio. Vous pouvez alors le couper, le décaler ou le garder alors que l'image change.</li>
    <li>La forme d'onde verte vous aide à repérer les temps forts et les silences.</li></ul>
    <h3>Voix off</h3>
    <p>${gk('mic')} enregistre votre voix avec le micro de l'ordinateur, à partir de la tête de lecture. Le montage peut défiler pendant que vous parlez (son coupé pour éviter l'écho). La voix est ensuite posée sur une piste audio libre.</p>
    <p>Le curseur de volume sous l'aperçu ne règle que ce que vous entendez, pas le fichier exporté.</p>`],
  ['export', 'exportv', 'Exporter', `
    <p class="lead">L'export transforme votre montage en un fichier vidéo à partager, publier ou archiver.</p>
    <p>Cliquez sur ${gk('exportv')} puis <b>Exporter la vidéo</b> (<kbd>Ctrl</kbd>+<kbd>E</kbd>) et choisissez :</p>
    <ul><li><b>Le format</b> : MP4 se lit partout (téléphones, TV, réseaux sociaux). WebM est très bien pour le web.</li>
    <li><b>La résolution</b> : celle du projet ou une plus petite pour un fichier plus léger.</li>
    <li><b>La qualité</b> : Haute convient presque toujours ; Maximale pour l'archivage.</li>
    <li><b>La partie</b> : tout le montage, ou seulement une zone.</li></ul>
    <h3>La zone</h3>
    <p>Placez la tête de lecture et appuyez sur <kbd>I</kbd> pour le début de la zone, puis <kbd>O</kbd> pour la fin. Elle apparaît en bleu sur la règle. Avec la lecture en boucle ${gk('loop')}, l'aperçu tourne sur cette zone.</p>
    <div class="tip"><b>Bon à savoir :</b> l'export rejoue le montage en temps réel. Un film de 3 minutes prend environ 3 minutes. Gardez l'onglet affiché pendant ce temps.</div>
    <p>Le même menu enregistre aussi <b>le son seul</b> ou <b>l'image</b> sous la tête de lecture (PNG), par exemple pour une miniature.</p>`],
  ['save', 'save', 'Sauvegarde', `
    <p class="lead">Un projet MOMOmov s'enregistre dans un fichier <b>.mmv</b> qui contient le montage et tous ses médias : vous pouvez le copier sur une clé USB ou un autre ordinateur, tout suivra.</p>
    <p>Le bouton ${gk('save')} regroupe :</p>
    <ul><li><b>Ouvrir</b> (<kbd>Ctrl</kbd>+<kbd>O</kbd>) : un projet .mmv ou des médias.</li>
    <li><b>Enregistrer</b> (<kbd>Ctrl</kbd>+<kbd>S</kbd>) : met à jour le fichier en cours.</li>
    <li><b>Enregistrer sous</b> (<kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>S</kbd>) : crée un nouveau fichier.</li>
    <li><b>Backup auto</b> : à l'intervalle choisi, une copie de secours est gardée dans le navigateur. En cas de fermeture accidentelle, elle vous est proposée au prochain démarrage.</li></ul>
    <p>Le point jaune devant le nom du projet signale des modifications non enregistrées.</p>
    <h3>Le format du projet</h3>
    <p>Menu <b>Projet</b> &gt; <b>Format et réglages</b> pour passer d'un format paysage à un format portrait ou carré, changer la résolution, la cadence ou la couleur de fond, même en cours de montage.</p>
    <p>${gk('mm')} ouvre <b>Momohub</b>, la page qui regroupe tous les MOMOgiciels.</p>`],
  ['clavier', 'keyb', 'Raccourcis', `
    <p class="lead">Les raccourcis qui font gagner le plus de temps.</p>
    <table>
      <tr><td><kbd>Espace</kbd></td><td>Lecture / pause</td></tr>
      <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Image précédente / suivante (<kbd>Maj</kbd> : une seconde)</td></tr>
      <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>Point de montage précédent / suivant</td></tr>
      <tr><td><kbd>Origine</kbd> <kbd>Fin</kbd></td><td>Début / fin du montage</td></tr>
      <tr><td><kbd>V</kbd> <kbd>C</kbd></td><td>Outil Sélection / Lame</td></tr>
      <tr><td><kbd>S</kbd></td><td>Scinder à la tête de lecture</td></tr>
      <tr><td><kbd>T</kbd></td><td>Ajouter un titre</td></tr>
      <tr><td><kbd>M</kbd></td><td>Poser un marqueur</td></tr>
      <tr><td><kbd>I</kbd> <kbd>O</kbd></td><td>Début / fin de zone · <kbd>Alt</kbd>+<kbd>X</kbd> pour l'effacer</td></tr>
      <tr><td><kbd>Suppr</kbd></td><td>Supprimer · <kbd>Maj</kbd>+<kbd>Suppr</kbd> en refermant le vide</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>X</kbd> / <kbd>V</kbd></td><td>Copier / couper / coller à la tête de lecture</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>D</kbd></td><td>Dupliquer</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>A</kbd></td><td>Tout sélectionner</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Y</kbd></td><td>Annuler / rétablir</td></tr>
      <tr><td><kbd>+</kbd> <kbd>-</kbd></td><td>Zoomer / dézoomer la timeline</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>I</kbd></td><td>Importer</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd> · <kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>Enregistrer · Ouvrir</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>Exporter la vidéo</td></tr>
      <tr><td><kbd>F1</kbd></td><td>Ce guide</td></tr>
    </table>`]
];
function openGuide(id) {
  const m = modal(`<div class="mh">${ic('guide', '', ' style="color:#facc15"')}Guide de MOMOmov<button class="x" data-close>${ic('x')}</button></div>
    <div class="guide"><nav class="gnav">${GUIDE.map(([k, i, t]) => `<button data-g="${k}" title="${t}">${ic(i)}</button>`).join('')}</nav><div class="gbody" id="gbody"></div></div>`, { wide: true });
  const show = k => { const g = GUIDE.find(x => x[0] === k) || GUIDE[0]; $('#gbody', m.el).innerHTML = `<h2>${ic(g[1])}${g[2]}</h2>${g[3]}`; $('#gbody', m.el).scrollTop = 0; $$('.gnav button', m.el).forEach(b => b.classList.toggle('on', b.dataset.g === g[0])); };
  $('.gnav', m.el).addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) show(b.dataset.g); });
  show(id || 'bienvenue');
}

/* ==========================================================================
   Actions, clavier, glisser-déposer, séparateurs, installation, démarrage
   ========================================================================== */
function doAct(a) {
  const [k, v] = a.split(/:(.*)/s);
  if (!P && !['install', 'guide', 'settings', 'hub', 'fullscreen', 'new', 'open'].includes(k)) return;
  switch (k) {
    case 'undo': return undo();
    case 'redo': return redo();
    case 'new': return startDialog(true);
    case 'import': return $('#fimport').click();
    case 'open': return openDialog();
    case 'save': return saveProject(false);
    case 'saveas': return saveProject(true);
    case 'backup': return backupNow(false);
    case 'restore': return restoreBackup();
    case 'export': return exportDialog(false);
    case 'exportaudio': return exportDialog(true);
    case 'snapshot': return snapshot(false);
    case 'snapbin': return snapshot(true);
    case 'guide': return openGuide();
    case 'settings': return settingsDialog();
    case 'projset': return projDialog();
    case 'fullscreen': return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { });
    case 'vfull': return document.fullscreenElement ? document.exitFullscreen() : $('#vwrap').requestFullscreen().catch(() => { });
    case 'install': return doInstall();
    case 'hub': return window.open('https://mowiss.github.io/Momohub/', '_blank', 'noopener');
    case 'tool': return setTool(v);
    case 'split': return doSplit(T);
    case 'del': return doDelete(false);
    case 'ripple': return doDelete(true);
    case 'dup': return doDuplicate();
    case 'copy': return doCopy(false);
    case 'cut': return doCopy(true);
    case 'paste': return doPaste();
    case 'detach': return doDetach();
    case 'freeze': return doFreeze();
    case 'speed': return doSpeed(+v);
    case 'mutesel': { const l = selClips().filter(isAV); if (!l.length) return toast('Sélectionnez un clip vidéo ou son'); const m = !l[0].mute; return act(() => { for (const c of l) c.mute = m; }); }
    case 'selall': SEL = new Set(P.clips.filter(c => !lockedClip(c)).map(c => c.id)); return refreshAll();
    case 'title': return addTitle(v);
    case 'color': return addColor();
    case 'look': return applyLook(v);
    case 'qt': return quickTrans(v);
    case 'voice': return voiceOver();
    case 'addv': act(() => addTrack('v')); return toast('Piste vidéo ajoutée');
    case 'adda': act(() => addTrack('a')); return toast('Piste audio ajoutée');
    case 'marker': return addMarker();
    case 'ioa': return setIO('a');
    case 'iob': return setIO('b');
    case 'ioclear': return clearIO();
    case 'purge': return purgeMedia();
    case 'magnet': SET.magnet = !SET.magnet; saveSet(); updTools(); return toast(SET.magnet ? 'Magnétisme activé' : 'Magnétisme désactivé');
    case 'safe': SET.safe = !SET.safe; saveSet(); updTools(); return drawOverlay();
    case 'loop': SET.loop = !SET.loop; saveSet(); updTools(); return toast(SET.loop ? (P.io ? 'Lecture en boucle sur la zone' : 'Lecture en boucle') : 'Boucle désactivée');
    case 'zin': return setZoom(TL.z * 1.4);
    case 'zout': return setZoom(TL.z / 1.4);
    case 'zfit': return zoomFit();
    case 'play': return togglePlay();
    case 'tstart': return setTime(0, { follow: true });
    case 'tend': return setTime(projDur(), { follow: true });
    case 'fprev': if (PLAY.on) pause(); return setTime(T - 1 / P.fps, { follow: true });
    case 'fnext': if (PLAY.on) pause(); return setTime(T + 1 / P.fps, { follow: true });
    case 'mvol': { SET.mvol = SET.mvol > 0 ? 0 : 1; if (MASTER) MASTER.gain.value = SET.mvol; const vr = $('#vol'); if (vr) vr.value = Math.round(SET.mvol * 100); saveSet(); return updTransport(); }
  }
}
async function doInstall() {
  const e = window.__installPrompt;
  if (e) { e.prompt(); const c = await e.userChoice; window.__installPrompt = null; if (c.outcome === 'accepted') $('#btn-install').classList.add('hidden'); return; }
  modal(`<div class="mh">${ic('install', '', ' style="color:#10b981"')}Installer MOMOmov<button class="x" data-close>${ic('x')}</button></div>
    <div class="mb" style="color:var(--g300);line-height:1.6">
      <p style="margin-top:0">Pour installer MOMOmov comme une application :</p>
      <ul><li><b style="color:#fff">Chrome / Edge</b> : cliquez sur l'icône d'installation à droite de la barre d'adresse, ou menu <b style="color:#fff">⋮</b> &gt; <b style="color:#fff">Installer MOMOmov</b>.</li>
      <li><b style="color:#fff">Safari (Mac)</b> : menu Fichier &gt; <b style="color:#fff">Ajouter au Dock</b>.</li>
      <li><b style="color:#fff">iPhone / iPad</b> : bouton Partager &gt; <b style="color:#fff">Sur l'écran d'accueil</b>.</li></ul>
      ${location.protocol.startsWith('http') ? '' : '<p style="color:#fbbf24">L\'installation n\'est possible que lorsque MOMOmov est ouvert depuis son adresse web, pas depuis un fichier local.</p>'}
    </div><div class="mf"><button class="btn pri" data-close>Compris</button></div>`);
}
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- Menus déroulants ---------- */
function closeMenus(ex) { $$('.menu:not(#ctx .menu)').forEach(m => { if (m !== ex) m.classList.add('hidden'); }); }
document.addEventListener('click', e => {
  const mbtn = e.target.closest('[data-menu]');
  if (mbtn) { const m = $('#' + mbtn.dataset.menu); const was = m.classList.contains('hidden'); closeMenus(); if (was) { m.classList.remove('hidden'); if (mbtn.dataset.menu === 'm-file') updBackupInfo(); } e.stopPropagation(); return; }
  if (!e.target.closest('#ctx')) hideCtx();
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) {
    if (b.closest('.menu') && e.target.closest('select')) return;
    closeMenus(); doAct(b.dataset.act); return;
  }
  if (!e.target.closest('.menu')) closeMenus();
});
$('#theads').addEventListener('click', e => {
  const b = e.target.closest('[data-tk]'); if (!b) return; const id = b.closest('[data-tr]').dataset.tr;
  if (b.dataset.tk === 'del') delTrack(id); else toggleTrack(id, b.dataset.tk);
});

/* ---------- Clavier ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  const ctrl = e.ctrlKey || e.metaKey, key = e.key;
  if (key === 'Escape') { if (MODALS.length) { const m = MODALS[MODALS.length - 1]; if (!m.lock) m.close(); return; } closeMenus(); hideCtx(); if (SEL.size) { SEL.clear(); refreshAll(); } return; }
  if (key === 'F1') { e.preventDefault(); return openGuide(); }
  if (MODALS.length) return;
  if (ctrl && !e.altKey) {
    const k = key.toLowerCase();
    const map = { s: e.shiftKey ? 'saveas' : 'save', o: 'open', n: 'new', i: 'import', e: 'export', d: 'dup' };
    if (map[k]) { e.preventDefault(); return doAct(map[k]); }
    if (typing) return;
    if (k === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if (k === 'y') { e.preventDefault(); return redo(); }
    if (k === 'a') { e.preventDefault(); return doAct('selall'); }
    if (k === 'c') { e.preventDefault(); return doCopy(false); }
    if (k === 'x') { e.preventDefault(); return doCopy(true); }
    if (k === 'v') { e.preventDefault(); return doPaste(); }
    return;
  }
  if (typing || !P) return;
  if (e.altKey && key.toLowerCase() === 'x') { e.preventDefault(); return clearIO(); }
  switch (key) {
    case ' ': e.preventDefault(); return togglePlay();
    case 'ArrowLeft': e.preventDefault(); if (PLAY.on) pause(); return setTime(T - (e.shiftKey ? 1 : 1 / P.fps), { follow: true });
    case 'ArrowRight': e.preventDefault(); if (PLAY.on) pause(); return setTime(T + (e.shiftKey ? 1 : 1 / P.fps), { follow: true });
    case 'ArrowUp': e.preventDefault(); return jumpEdit(-1);
    case 'ArrowDown': e.preventDefault(); return jumpEdit(1);
    case 'Home': e.preventDefault(); return setTime(0, { follow: true });
    case 'End': e.preventDefault(); return setTime(projDur(), { follow: true });
    case 'Delete': case 'Backspace': e.preventDefault(); return doDelete(e.shiftKey);
    case '+': case '=': return setZoom(TL.z * 1.4);
    case '-': case '_': return setZoom(TL.z / 1.4);
  }
  switch (key.toLowerCase()) {
    case 'v': return setTool('sel');
    case 'c': case 'b': return setTool('blade');
    case 's': return doSplit(T);
    case 't': return addTitle('center');
    case 'm': return addMarker();
    case 'i': return setIO('a');
    case 'o': return setIO('b');
    case 'l': return doAct('loop');
  }
});
window.addEventListener('keydown', e => { if (e.key === 'Alt') NOSNAP = true; });
window.addEventListener('keyup', e => { if (e.key === 'Alt') NOSNAP = false; });

/* ---------- Glisser des fichiers dans la fenêtre ---------- */
let DZC = 0;
window.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { DZC++; const d = $('#dropzone'); d.innerHTML = ic('import') + 'Déposez vos vidéos, sons, images ou un projet .mmv'; d.classList.remove('hidden'); } });
window.addEventListener('dragleave', e => { if ([...e.dataTransfer.types].includes('Files')) { DZC = Math.max(0, DZC - 1); if (!DZC) $('#dropzone').classList.add('hidden'); } });
window.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { DZC = 0; $('#dropzone').classList.add('hidden'); if (e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); if (P) importFiles(e.dataTransfer.files, null); } });
$('#fimport').addEventListener('change', e => { importFiles(e.target.files, null); e.target.value = ''; });
$('#fopen').addEventListener('change', e => { importFiles(e.target.files, null); e.target.value = ''; });

/* ---------- Séparateurs ---------- */
function applySizes() {
  const r = document.documentElement.style;
  r.setProperty('--tlh', SET.tlH + 'px'); r.setProperty('--binw', SET.binW + 'px'); r.setProperty('--inspw', SET.inspW + 'px');
}
function splitter(el, axis, get, set) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on');
    const p0 = axis === 'x' ? e.clientX : e.clientY, v0 = get();
    const mv = ev => { set(v0 + ((axis === 'x' ? ev.clientX : ev.clientY) - p0)); applySizes(); };
    const up = () => { el.classList.remove('on'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); saveSet(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
splitter($('#vs1'), 'x', () => SET.binW, v => SET.binW = clamp(v, 150, 480));
// ceux-ci se tirent dans l'autre sens (le panneau est après le séparateur)
(function inverseSplitters() {
  for (const [id, key, axis, lo, hiF] of [['#vs2', 'inspW', 'x', 220, () => 480], ['#hsplit', 'tlH', 'y', 130, () => innerHeight - 260]]) {
    const n = $(id);
    n.addEventListener('pointerdown', e => {
      e.preventDefault(); n.setPointerCapture(e.pointerId); n.classList.add('on');
      const p0 = axis === 'x' ? e.clientX : e.clientY, v0 = SET[key];
      const mv = ev => { SET[key] = clamp(v0 - ((axis === 'x' ? ev.clientX : ev.clientY) - p0), lo, hiF()); applySizes(); };
      const up = () => { n.classList.remove('on'); n.removeEventListener('pointermove', mv); n.removeEventListener('pointerup', up); saveSet(); };
      n.addEventListener('pointermove', mv); n.addEventListener('pointerup', up);
    });
  }
})();

/* ---------- Démarrage ---------- */
window.addEventListener('beforeunload', e => { if (DIRTY && P && (P.clips.length || P.media.length)) { if (BK.pending) backupNow(true); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && BK.pending && P && (P.clips.length || P.media.length) && SET.backup > 0 && !EXP) backupNow(true); });
function boot() {
  applySizes();
  buildHeader(); buildTools(); buildTLBar(); buildTransport();
  binInit(); viewerInit(); inspInit(); TLinit();
  CX = $('#cv').getContext('2d');
  if (isStandalone()) $('#btn-install').classList.add('hidden');
  P = newProjectData();
  refreshAll(); setZoom(60, 0); TL.sx = 0;
  armBackup();
  requestAnimationFrame(frameLoop);
  let launched = false;
  if ('launchQueue' in window) {
    launchQueue.setConsumer(async p => {
      if (!p.files || !p.files.length) return; launched = true;
      const files = await Promise.all(p.files.map(h => h.getFile()));
      const i = files.findIndex(f => /\.mmv$/i.test(f.name));
      if (i >= 0) { closeModals(); await openProjectFile(files[i], p.files[i]); }
      else { closeModals(); await importFiles(files, { t: 0 }); }
    });
  }
  const showStart = () => setTimeout(() => { if (!launched && !P.clips.length && !P.media.length && !MODALS.length) startDialog(false); }, 120);
  if (document.getElementById('mv-splash')) window.addEventListener('mv-splash-done', showStart, { once: true }); else showStart();
}
boot();

</script>
